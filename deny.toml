# cargo-deny: advisories, licenses, bans and sources for the whole workspace. Run by `just deny`.
# Stepclimb is AGPL-3.0-or-later (LICENSE); the workspace crates are unpublished, so their own
# license is skipped here. The Tauri shell has its own workspace; `just app-build` checks it with
# `--manifest-path apps/app/src-tauri/Cargo.toml`.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
# RUSTSEC-2023-0071 (Marvin attack) is about the timing of RSA private-key operations. `rsa`
# arrives only through webauthn-rs 0.6.2's `crypto-glue`, at 0.10.0-rc.19, which already computes
# on crypto-bigint but sorts before the advisory's fixed 0.10.0. webauthn-rs only verifies RS256
# passkey signatures, a public-key operation that holds no secret to leak
# (docs/adr/0026-webauthn-rs-for-passkeys.md). This ignore holds only while crypto-glue (through
# webauthn-rs) is the one crate that depends on `rsa`: a second dependent must be judged on its
# own before it lands. Remove it on or after 2026-11-22, when `rsa` 0.10.0 and the crypto-bigint
# 0.7.11 it requires are 14 days old: `cargo update -p rsa` to 0.10.0 or later, then drop this
# entry (issue #164).
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is used only to verify RS256 passkey signatures; see ADR 0026" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Licenses compatible with distributing the whole as AGPL-3.0-or-later. Permissive licenses,
# MPL-2.0 (file-level copyleft, compatible with the GPL family), and the AGPL/GPL-3.0 family
# itself. GPL-2.0-only is not compatible with AGPL-3.0 and is refused, as is anything not listed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The server's TLS, when it needs one, is rustls; OpenSSL needs system libraries the images do
# not carry.
deny = [
    { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
