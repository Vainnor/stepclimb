# cargo-deny: advisories, licenses, bans and sources for the whole workspace. Run by `just deny`.
# Stepclimb is AGPL-3.0-or-later (LICENSE); the workspace crates are unpublished, so their own
# license is skipped here. The Tauri shell has its own workspace; `just app-build` checks it with
# `--manifest-path apps/app/src-tauri/Cargo.toml`.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
# RUSTSEC-2023-0071 (Marvin attack) is about the timing of RSA private-key operations; it is
# fixed in `rsa` 0.10.0. Two lines of `rsa` are in the tree:
# - 0.10.0-rc.19, through webauthn-rs 0.6.2's `crypto-glue`, which sorts before 0.10.0.
#   webauthn-rs only verifies RS256 passkey signatures, a public-key operation with no secret to
#   leak (docs/adr/0026-webauthn-rs-for-passkeys.md);
# - 0.9.10, through openidconnect 4.1.0, which needs ^0.9 and only verifies ID tokens, and the
#   test-only mock identity provider, whose throwaway keys are the only private keys: on 127.0.0.1
#   in tests, and in the `just e2e` stack's mock-idp container, published on 127.0.0.1 only
#   (docs/adr/0027-mock-identity-provider.md).
# A further dependent of `rsa` must be judged on its own before it lands. Remove this entry when
# `cargo tree --target all -e all -i rsa` shows only rsa 0.10.0 or later (issue #164).
# RUSTSEC-2026-0533 is a mutation XSS in ammonia before 4.2.5 that needs MathML and SVG elements
# enabled together; page rendering's allowlist (`stepclimb_core::page_doc::render`) enables
# neither, and a test there refuses both. 4.2.5 fixes it but was published on 2026-11-13, under
# the 14 days this project waits for a release. Remove this entry when ammonia is bumped to 4.2.5
# or later, on or after 2026-11-27.
ignore = [
    { id = "RUSTSEC-2026-0533", reason = "ammonia 4.2.4: needs MathML and SVG in the allowlist, which page rendering never enables; bump to 4.2.5 on or after 2026-11-27" },
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 (openidconnect, mock IdP) and 0.10.0-rc.19 (webauthn-rs): shipped code only verifies; private keys only in the test-only mock (ADR 0026, 0027, issue #164)" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Licenses compatible with distributing the whole as AGPL-3.0-or-later. Permissive licenses,
# MPL-2.0 (file-level copyleft, compatible with the GPL family), and the AGPL/GPL-3.0 family
# itself. GPL-2.0-only is not compatible with AGPL-3.0 and is refused, as is anything not listed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The server's TLS, when it needs one, is rustls; OpenSSL needs system libraries the images do
# not carry.
deny = [
    { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
