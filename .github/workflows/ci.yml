# SPDX-License-Identifier: AGPL-3.0-or-later
# The merge gate: the same `just ci` that runs locally, on a standard GitHub-hosted Linux runner.
# Actions are pinned by commit SHA; tool versions match flake.nix and the repo's pins.
name: ci

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@1.59.0,cargo-nextest@0.9.149,cargo-deny@0.20.2,sqlx-cli@0.9.0,gitleaks@8.30.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Secret scan of the history
        run: just secrets-scan history
      - name: just ci
        run: just ci
