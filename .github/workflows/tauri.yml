# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the Tauri shell (apps/app), unsigned and unbundled. Linux on every PR and push; macOS
# and Windows only on pushes to main, to keep the private repository's free Actions minutes
# (macOS counts 10x, Windows 2x) for releases (owner, 2026-11-12). Standard hosted runners only;
# a paid or larger runner is the owner's call (.claude/rules/cross-platform.md).
name: tauri

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        is-main:
          - ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        exclude:
          - is-main: false
            os: macos-15
          - is-main: false
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/app/src-tauri
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Tokens
        run: pnpm --filter @stepclimb/tokens build
      - name: Build the app (runs the web build first)
        run: pnpm --filter @stepclimb/app build
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (the app's own workspace)
        if: runner.os == 'Linux'
        run: cargo deny --manifest-path apps/app/src-tauri/Cargo.toml check
