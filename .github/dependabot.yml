# Dependency update PRs (plan, Technical -> Security and privacy: supply chain). Each PR passes
# `just ci` like any other. The cooldown keeps every proposed version at least 14 days old, the
# same rule pnpm enforces (pnpm-workspace.yaml) and architecture.md states for crates.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/apps/app/src-tauri"]
    target-branch: next
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      cargo-minor:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: "/"
    target-branch: next
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      npm-minor:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: next
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: "ci(deps)" }
  - package-ecosystem: docker
    directory: "/deploy"
    target-branch: next
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    commit-message: { prefix: "chore(deps)" }
