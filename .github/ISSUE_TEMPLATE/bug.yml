name: Bug report
description: Something does not work as the plan or a spec says
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, commands or a failing test. Use example data only, never real member data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Browser and OS, app platform, or deployment (Compose, Helm, binary)
