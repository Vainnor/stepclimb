# SPDX-License-Identifier: AGPL-3.0-or-later
# Stepclimb on Docker Compose: the server, PostgreSQL 16 and MinIO (plan, Technical -> Hosting:
# "stepclimb and postgres, with optional Caddy and MinIO").
#
# Local development runs only the dependencies: `just up` (postgres and minio), one stack shared by
# every worktree. The full stack, with the server built from deploy/Dockerfile, is `just
# up-stack`. `just ci` and `just e2e` use neither: each run starts its own project from this file
# and ci.yaml (bin/ci_gate.py). The credentials below are for a local machine only.
#
# Images are pinned by digest. MinIO's own image is no longer on Docker Hub, so this uses
# Chainguard's build, which publishes only `latest`: the digest is the pin
# (docs/adr/0019-minio-image.md).
name: stepclimb

services:
  postgres:
    image: postgres:16.16-alpine@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
    environment:
      POSTGRES_USER: stepclimb
      POSTGRES_PASSWORD: stepclimb-local
      POSTGRES_DB: stepclimb
    ports:
      - "127.0.0.1:${SC_DEV_PG_PORT:-55432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    # Over TCP, as the server connects: while the image initializes a new data directory it runs
    # a server on the Unix socket only, which a socket check would report healthy.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U stepclimb -d stepclimb"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The bucket `stepclimb`, which the server stores course files in, is made before MinIO
  # starts: a top-level directory of the data directory is a bucket to MinIO, on a new volume and
  # an existing one. The image has no `mc`.
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:96b6cf3e14084d3427ec46de10c2873af61b945ad9272eec266cfc8df551cba5
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/stepclimb && exec minio server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: stepclimb
      MINIO_ROOT_PASSWORD: stepclimb-local
    ports:
      - "127.0.0.1:${SC_DEV_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${SC_DEV_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio:/data
    # The image has bash but no curl: ask MinIO's readiness endpoint over /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /minio/health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3
          && read -r status <&3
          && [[ $$status == *" 200 "* ]]
      interval: 2s
      timeout: 3s
      retries: 30

  stepclimb:
    profiles: ["stack"]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: ${SC_IMAGE:-stepclimb:local}
    environment:
      STEPCLIMB_DATABASE_URL: postgres://stepclimb:stepclimb-local@postgres:5432/stepclimb
      STEPCLIMB_BIND: 0.0.0.0:8080
      # The address the browser opens; the CSRF check accepts it as an Origin (spec 08 Q1, Q6).
      STEPCLIMB_PUBLIC_URL: http://localhost:${SC_DEV_PORT:-58080}
      # The published development key ring (development-encryption-keys): one key whose 32
      # bytes spell "stepclimb-local-development-key!". The server warns about it at startup.
      # Never use it for real data.
      STEPCLIMB_ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
      # Course files in the MinIO above, bucket `stepclimb`, with its development credentials
      # (docs/specs/m1/06-files.md, Configuration).
      STEPCLIMB_STORAGE_URL: s3://stepclimb
      STEPCLIMB_STORAGE_S3_ENDPOINT: http://minio:9000
      STEPCLIMB_STORAGE_S3_ALLOW_HTTP: "true"
      STEPCLIMB_STORAGE_S3_ACCESS_KEY_ID: stepclimb
      STEPCLIMB_STORAGE_S3_SECRET_ACCESS_KEY: stepclimb-local
    secrets:
      - encryption_keys
    ports:
      - "127.0.0.1:${SC_DEV_PORT:-58080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

secrets:
  encryption_keys:
    file: ./development-encryption-keys

volumes:
  postgres:
  minio:
