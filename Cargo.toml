[workspace]
resolver = "3"
members = [
    "crates/stepclimb-server",
    "crates/stepclimb-core",
    "crates/stepclimb-auth",
    "crates/stepclimb-assess",
    "crates/stepclimb-activities",
    "crates/stepclimb-activities-atc",
    "crates/stepclimb-interop",
    "crates/stepclimb-integrations",
    "crates/stepclimb-connectors",
    "crates/stepclimb-media",
    "crates/stepclimb-jobs",
    "crates/stepclimb-mock-idp",
]
# The Tauri shell is its own workspace with its own lockfile: it needs WebKitGTK on Linux to
# build, which the server's gates do not; `just app-build` builds it.
exclude = ["apps/app/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Vainnor/stepclimb"
publish = false

# Versions are pinned once here and referenced by members with `<dep>.workspace = true`
# (.claude/rules/architecture.md -> Dependencies). The layering rules are in
# bin/check-layering.sh.
[workspace.dependencies]
stepclimb-core = { path = "crates/stepclimb-core" }
stepclimb-auth = { path = "crates/stepclimb-auth" }
stepclimb-assess = { path = "crates/stepclimb-assess" }
stepclimb-activities = { path = "crates/stepclimb-activities" }
stepclimb-activities-atc = { path = "crates/stepclimb-activities-atc" }
stepclimb-interop = { path = "crates/stepclimb-interop" }
stepclimb-integrations = { path = "crates/stepclimb-integrations" }
stepclimb-connectors = { path = "crates/stepclimb-connectors" }
stepclimb-media = { path = "crates/stepclimb-media" }
stepclimb-jobs = { path = "crates/stepclimb-jobs" }
stepclimb-mock-idp = { path = "crates/stepclimb-mock-idp" }

# HTTP (plan, Technical -> Architecture and stack: axum 0.8, tower-http, tokio).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["trace"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
http-body-util = "=0.1.5"
# The `Expires` attribute of the session cookie (docs/specs/m0/08-sessions-and-csrf.md B7, Q5);
# the version hyper already brings.
httpdate = "=1.0.3"

# Database (plan: PostgreSQL 16+ via sqlx 0.9, compile-checked queries, committed .sqlx/,
# embedded migrations run at startup).
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid"] }

# API docs (plan: utoipa 5 -> OpenAPI 3.1, Scalar UI at /docs). utoipa 6.0.0 exists; the plan
# names 5, so this stays on the 5.x line, and utoipa-scalar 0.3 is the release for utoipa 5 and
# axum 0.8.
utoipa = { version = "=5.5.0", default-features = false, features = ["macros"] }
utoipa-scalar = { version = "=0.3.0", default-features = false, features = ["axum"] }

# The built web SPA, embedded into the binary (plan: web/ is embedded at build time).
rust-embed = { version = "=8.13.0", default-features = false, features = ["mime-guess"] }

# Keys are UUID v7 generated by the server (spec 02 B4, Q7: the `uuid` crate).
uuid = { version = "=1.29.0", default-features = false, features = ["std", "v7", "serde"] }
# Pagination cursors are base64url (spec 02 B3).
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }

# Cryptography for stepclimb-auth (docs/specs/m0/08-sessions-and-csrf.md B2, B3, Q2, Q3): tokens
# from the OS CSPRNG, SHA-256 token hashes compared in constant time, CRC-32 API-key checksums,
# base64 encodings (the `base64` entry above), AES-256-GCM for secrets the server reads back.
# crc is the version sqlx already brings.
getrandom = { version = "=0.4.3", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
crc = "=3.4.0"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }

# IANA time zone names (docs/specs/m0/03-users-and-identities.md B3, Q4): a user's `tz` and the
# organization's default are validated against the time zone database jiff bundles
# (`jiff-tzdb`), so the answer is the same on every host and in the distroless image whatever
# zoneinfo it carries. M1's due dates need its zone arithmetic too.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# The `matches` test of admission rules (docs/specs/m0/07-admission.md Q1): linear-time
# matching, so a pattern an admin saves cannot make a sign-in run long. Its regex-automata,
# regex-syntax, aho-corasick and memchr are the versions tracing-subscriber already brings.
regex = "=1.13.1"
# Checks that a `matches` pattern parses on its own before admission rules wrap it in anchors
# (spec 07 Q1); the version regex already brings.
regex-syntax = "=0.8.11"
# stepclimb.toml, the optional configuration file under the STEPCLIMB_* variables
# (docs/specs/m0/14-compose-deploy.md B8 to B10). Parse and serde only; nothing writes TOML.
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# The database URL's query parameters, read with the parser sqlx itself uses, so the loader can
# refuse one sqlx would ignore (docs/specs/m0/14-compose-deploy.md B10). The version sqlx brings.
url = { version = "=2.5.8", default-features = false, features = ["std"] }
# Outbound HTTP to identity providers and the admission webhook (docs/specs/m0/05-oidc.md I1,
# Q4): `stepclimb_auth::outbound`. reqwest with rustls and no built-in crypto provider: the
# client hands reqwest a rustls config whose crypto is ring (a C compiler only; aws-lc-rs,
# reqwest's default, also needs cmake) and whose certificates are checked against the system's
# trust store by rustls-platform-verifier (the version reqwest brings), so an operator's
# internal CA works. No proxy, cookie, decompression or HTTP/2 feature. `http` is the version
# hyper already brings; its request and response types are what the `openidconnect` crate's
# HTTP client trait takes.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
http = "=1.5.0"
# The mock identity provider's ID tokens (docs/specs/m0/06-oauth2-and-vatsim-preset.md I1,
# docs/adr/0027-mock-identity-provider.md): RS256 keys generated at start and PKCS #1 v1.5
# signatures. 0.9 is the line openidconnect 4.1 verifies with, so the mock adds no rsa beyond
# the 0.9 openidconnect brings; webauthn-rs brings 0.10.0-rc.19 beside it. openidconnect brings
# rsa 0.9.10 into the release build, where it only verifies ID token signatures; only the
# test-only mock (bin/check-layering.sh rule 5) uses private keys, and clippy.toml's
# disallowed-types refuses them anywhere else.
rsa = { version = "=0.9.10", default-features = false, features = ["std", "u64_digit", "getrandom", "sha2"] }
# OpenID Connect for the relying party (plan, Technical -> Architecture and stack: `openidconnect`):
# stepclimb-auth's discovery document, PKCE and authorization request (spec 05 I2), and the mock's
# tests, which parse what the mock serves (spec 06 T1). No default features: its reqwest adapter
# is not used, every provider request goes through `stepclimb_auth::outbound` (ADR 0025).
openidconnect = { version = "=4.1.0", default-features = false }
# App access tokens of the OAuth 2.1 server for Stepclimb's own apps (plan, Technical -> Decided:
# "built on `oauth2`/`jsonwebtoken`"; docs/specs/m0/08-sessions-and-csrf.md Q12, B46): the JWS
# framing, header and claim checks of HS256 JWTs. No default features (`use_pem`: no PEM keys) and
# no crypto backend feature: `stepclimb_auth::oauth_server::access_token` installs its own
# `CryptoProvider`, HS256 only, over the `hmac` and `sha2` pinned here, so no second crypto stack.
jsonwebtoken = { version = "=11.1.0", default-features = false }
# OAuth 2 for the relying party (plan, Technical -> Architecture and stack: `oauth2`): the code
# exchange of a generic OAuth 2 provider's sign-in (docs/specs/m0/06-oauth2-and-vatsim-preset.md
# I3), the version openidconnect 4.1 already brings. No default features: its reqwest adapter is
# not used, the token request goes through `stepclimb_auth::outbound` (ADR 0025).
oauth2 = { version = "=5.0.0", default-features = false }
# Object storage for course files (docs/specs/m1/06-files.md B1, B2; plan, Technical ->
# Architecture and stack: "Storage: the `object_store` crate"): a local directory (`fs`) and S3 or
# MinIO (`aws-base`). Not the `aws` feature, which brings aws-lc-rs (cmake) and reqwest's own
# rustls setup: `ring` signs S3 requests with the ring the workspace already builds, and
# `stepclimb_server::storage` hands the store a reqwest client with the same rustls, ring and
# platform-verifier setup as `stepclimb_auth::outbound`, so no HTTP/2 or second TLS stack.
object_store = { version = "=0.14.2", default-features = false, features = ["fs", "aws-base", "ring"] }
# object_store's `HttpService` trait is an `async_trait`; the version object_store and sqlx already
# bring.
async-trait = "=0.1.92"
tracing = "=0.1.44"
# WebAuthn for local passkeys (docs/specs/m0/04-local-accounts.md B8, Q12; plan, Technical ->
# Architecture and stack: webauthn-rs). 0.6 verifies with RustCrypto (`crypto-glue`) where 0.5
# needed OpenSSL, which deny.toml refuses. Default features off: `attestation` is for vetting
# devices, which Q12 does not do. `danger-allow-state-serialisation` lets a ceremony's state be
# stored, sealed, in the sign-in flow between its two requests (docs/specs/m0/08-sessions-and-csrf.md
# B17, B20). The soft authenticator is the project's own, for tests only.
webauthn-rs = { version = "=0.6.2", default-features = false, features = ["danger-allow-state-serialisation"] }
webauthn-authenticator-rs = { version = "=0.6.2", default-features = false, features = ["softpasskey"] }
# Password hashing for local accounts (docs/specs/m0/04-local-accounts.md B16, Q8; plan,
# Technical -> Architecture and stack: `argon2`): argon2id in the PHC string format. Default
# features off: `alloc` and `password-hash` for the PHC strings, `getrandom` for each hash's
# salt, `zeroize` to wipe the working memory. No `parallel`: one lane (Q8), so rayon adds nothing.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom", "zeroize"] }
# TOTP for local accounts (docs/specs/m0/04-local-accounts.md B19 to B21, Q11): RFC 6238 over
# HMAC-SHA-1 in `stepclimb_auth::totp`, and base32 for the secret an authenticator app takes. The
# versions the lockfile already holds (webauthn-rs-core and sqlx-postgres bring them); no TOTP crate,
# since the algorithm is a dozen lines checked against the RFCs' own test vectors. sha1's `oid`
# and `alloc` are not needed.
hmac = { version = "=0.13.0", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
# Wipes a TOTP secret's bytes when it is dropped (`stepclimb_auth::totp::Secret`). The version
# argon2 and the RustCrypto crates already bring; `alloc` for the decrypted `Vec`.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Clippy refuses an outer `#[allow]` and any `allow` or `expect` without a reason, so an outer
# lint is silenced with `#[expect(lint, reason = "...")]`, which fails once the lint stops firing.
# It does not see inner `#![allow]` or lint settings in Cargo files; bin/check-lint-escapes.py
# (`just lint-escapes`) refuses those.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The mock identity provider generates 2048-bit RSA keys at start; unoptimized, the prime search
# takes seconds per key.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Unoptimized, one argon2id hash at Q8's parameters (19 MiB, 2 passes) takes seconds, and the
# password tests compute dozens (docs/specs/m0/04-local-accounts.md T10, T12).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
