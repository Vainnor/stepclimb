[package]
name = "stepclimb-auth"
description = "Identity providers, sessions, CSRF, API keys and the OAuth 2.1 server for Stepclimb's own apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `totp::Secret::code_at_time`, for tests that play an authenticator app. Enabled by the server's
# dev-dependency, so a build without dev-dependencies (the release image) never has it.
test-support = []

[dependencies]
getrandom.workspace = true
sha2.workspace = true
subtle.workspace = true
crc.workspace = true
base64.workspace = true
aes-gcm.workspace = true
thiserror.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
http.workspace = true
tokio.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
openidconnect.workspace = true
oauth2.workspace = true
argon2.workspace = true
hmac.workspace = true
sha1.workspace = true
data-encoding.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "test-util"] }
webauthn-authenticator-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The OIDC discovery tests run against the mock on 127.0.0.1 (spec 05 Test cases). A
# dev-dependency only (bin/check-layering.sh rule 5).
stepclimb-mock-idp.workspace = true

[lints]
workspace = true
