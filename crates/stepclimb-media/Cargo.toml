[package]
name = "stepclimb-media"
description = "tus uploads, ffmpeg transcode to HLS/MP4, posters, captions, signed delivery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# ffmpeg and ffprobe run as child processes under the transcode's limits
# (docs/specs/m1/08-uploaded-video.md B10): `process` spawns them, `io-util` reads their output,
# `time` bounds them.
tokio = { workspace = true, features = ["process", "io-util", "time"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util", "time", "fs"] }

[lints]
workspace = true
