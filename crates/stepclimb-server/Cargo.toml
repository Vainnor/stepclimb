[package]
name = "stepclimb-server"
description = "The axum application, its handlers and configuration, and the `stepclimb` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "stepclimb"
path = "src/main.rs"

[features]
# The organization header of `request_org`, for the server's tests only (spec 09 B20). Enabled by
# the dev-dependency on this crate below, so a build without dev-dependencies or `--all-features`
# (`cargo build`, the release image) never has it.
test-support = []
# The VATSIM Connect sign-in preset, `preset = "vatsim"` (spec 06 B18, Q4), whose data lives in
# `stepclimb-connectors`. On by default, so the release binary has it; a build without it
# refuses the preset with `provider.preset_unknown` (B19).
default = ["vatsim"]
vatsim = ["dep:stepclimb-connectors", "stepclimb-connectors/vatsim"]

[dependencies]
stepclimb-core.workspace = true
stepclimb-auth.workspace = true
# The job worker of `serve`'s `all` and `worker` roles (docs/specs/m1/01-job-queue-and-outbox.md
# B13 to B15).
stepclimb-jobs.workspace = true
stepclimb-connectors = { workspace = true, optional = true }
axum.workspace = true
# `sync` for the semaphore that caps concurrent password hashes (spec 04 B16).
tokio = { workspace = true, features = ["sync"] }
tower-http.workspace = true
httpdate.workspace = true
sqlx.workspace = true
utoipa.workspace = true
utoipa-scalar.workspace = true
rust-embed.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
clap.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Course file storage (docs/specs/m1/06-files.md B1): the store, and the S3 client's transport.
object_store.workspace = true
async-trait.workspace = true
reqwest.workspace = true
http.workspace = true
http-body-util.workspace = true

[dev-dependencies]
# `test-util` for tokio's paused time in the admission webhook call tests.
tokio = { workspace = true, features = ["test-util"] }
# `default-features = false`, so `--no-default-features` builds the tests without `vatsim` too.
stepclimb-server = { path = ".", default-features = false, features = ["test-support"] }
stepclimb-core = { workspace = true, features = ["test-support"] }
stepclimb-auth = { workspace = true, features = ["test-support"] }
base64.workspace = true
tower.workspace = true
# `channel` for request bodies a test holds open, such as an upload that stalls
# (docs/specs/m1/06-files.md B5).
http-body-util = { workspace = true, features = ["channel"] }
# The software passkey the passkey enrollment tests register with, and the WebAuthn types it
# reads the server's options into.
webauthn-rs.workspace = true
webauthn-authenticator-rs.workspace = true
# The mock identity provider on 127.0.0.1 the provider sign-in tests run against (spec 05 Test
# cases). A dev-dependency only (bin/check-layering.sh rule 5).
stepclimb-mock-idp.workspace = true
# The admission webhook tests' receiver checks the Standard Webhooks signature with its own
# HMAC-SHA256 (docs/specs/m0/07-admission.md T10, T18); the version stepclimb-auth uses.
hmac.workspace = true

[lints]
workspace = true
