[package]
name = "stepclimb-server"
description = "The axum application, its handlers and configuration, and the `stepclimb` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "stepclimb"
path = "src/main.rs"

[features]
# The organization header of `request_org`, for the server's tests only (spec 09 B20). Enabled by
# the dev-dependency on this crate below, so a build without dev-dependencies or `--all-features`
# (`cargo build`, the release image) never has it.
test-support = []

[dependencies]
stepclimb-core.workspace = true
stepclimb-auth.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
httpdate.workspace = true
sqlx.workspace = true
utoipa.workspace = true
utoipa-scalar.workspace = true
rust-embed.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
clap.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `test-util` for `tokio::time::pause` in the sign-in flow cleanup timer test.
tokio = { workspace = true, features = ["test-util"] }
stepclimb-server = { path = ".", features = ["test-support"] }
base64.workspace = true
tower.workspace = true
http-body-util.workspace = true

[lints]
workspace = true
