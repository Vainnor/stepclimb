#
# CHANGING THIS FILE RE-POINTS EVERY LINKED IDENTITY. Every organization's VATSIM provider reads
# these values at each sign-in (rows store only their overrides). A different `claims.subject`
# pointer, an endpoint origin (`authorize`, `token`, `userinfo`) or an attribute pointer changes
# whose account an existing identity signs in as, or what admission rules read, in every
# organization at once, with no admin's write and none of the API's permission checks. Such a
# change needs its own review and a release note; `stepclimb_server::presets` pins these values
# in a test named for that risk.
#
# VATSIM Connect as a sign-in preset (docs/specs/m0/06-oauth2-and-vatsim-preset.md B18, Q4).
# The values are the plan's `[[providers]]` example (spec 06 B11). VATSIM documents the
# endpoints, scopes and the `/api/user` body at https://vatsim.dev/api/connect-api; its
# development environment is https://auth-dev.vatsim.net (https://vatsim.dev/services/connect/sandbox),
# which an organization reaches by overriding the three URLs.
#
# `pkce` stays on (spec 06 Q3). Connect's documentation does not mention PKCE, but a sign-in
# through the Connect sandbox (auth-dev.vatsim.net) on 2026-11-17, from a server built from
# `next` at c907eea8, completed the token exchange and the userinfo read with an S256 challenge
# and the client secret sent by HTTP Basic (spec 06, the preset's PKCE note; issue #339).
# Production (auth.vatsim.net) has not been checked. Overriding `pkce = false` removes the
# protection against an injected authorization code; it is not needed for Connect.

kind = "oauth2"
key = "vatsim"
label = "Sign in with VATSIM"

[config]
authorize = "https://auth.vatsim.net/oauth/authorize"
token = "https://auth.vatsim.net/oauth/token"
userinfo = "https://auth.vatsim.net/api/user"
scopes = ["full_name", "vatsim_details", "email"]
pkce = true

[config.claims]
subject = "/data/cid"
given_name = "/data/personal/name_first"
family_name = "/data/personal/name_last"
email = "/data/personal/email"
attributes.rating = "/data/vatsim/rating/short"
attributes.subdivision = "/data/vatsim/subdivision/id"
