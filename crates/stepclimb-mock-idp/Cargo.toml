[package]
name = "stepclimb-mock-idp"
description = "A mock OpenID Connect and OAuth 2 identity provider on a loopback port, for tests only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
