sha2.workspace = true
getrandom.workspace = true
rsa.workspace = true
url.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
stepclimb-auth.workspace = true
openidconnect.workspace = true
http.workspace = true

[lints]
workspace = true
