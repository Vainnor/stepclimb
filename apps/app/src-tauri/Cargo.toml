[package]
name = "stepclimb-app"
description = "The Tauri 2 shell around the Stepclimb web app (desktop and, later, iOS)."
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

# Its own workspace and lockfile: the server's workspace excludes it (root Cargo.toml), so the
# server's gates never need WebKitGTK.
[workspace]

[lib]
name = "stepclimb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[lints.rust]
unsafe_code = "forbid"
