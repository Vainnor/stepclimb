# Secret scanning config for Stepclimb. Used by `just secrets-scan` (part of `just ci`) and the
# pre-commit hook, so both agree. Docs: https://github.com/gitleaks/gitleaks
[extend]
useDefault = true

[allowlist]
description = "Paths that never hold real secrets"
paths = [
  '''(^|/)target/''',
  '''(^|/)node_modules/''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)\.sqlx/''',
  '''(^|/)\.gitleaks\.toml$''',
  # Ignored output of `just ui-visual`: the minified Storybook bundle trips generic-api-key, a
  # false positive; test-results holds Playwright's traces of the same bundle.
  '''^apps/ui-docs/storybook-static/''',
  '''^apps/ui-docs/test-results/''',
]
